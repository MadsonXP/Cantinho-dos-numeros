.dots i.g{box-shadow:0 0 0 .15rem #ffc21a}
.bonus{display:inline-block;margin-top:.6rem;padding:.3rem 1.2rem;border-radius:2rem;background:linear-gradient(#ffe066,#ffb400);color:#5a3b00;font-weight:700;font-size:1.4rem;animation:pop .6s}
.rc.gd{border-left-color:var(--sun);background:#fff8dc}.gb{color:#b07a00}
</style>
</head>
<body>
<main id="app"></main>
<script>
const app=document.getElementById('app');
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const EM=["🍪","🐟","⭐","🍎","🦆","🎈","🚗","🐶"];
const col=n=>`hsl(${(n*47)%360} 75% 50%)`;
const OPS={p:['➕','Soma','mais','+'],m:['➖','Subtração','menos','−'],x:['✖️','Vezes','vezes','×'],d:['➗','Divisão','dividido por','÷']};
const dcfg=()=>{const o={};['conta','bal','mon','tre','pes','mnt','mer','seq','int','org'].forEach(g=>o[g]={min:0,max:5,ops:['p','m'],lv:1});return o;};
let ST={cfg:dcfg(),stars:0,voice:true},cur=home,W=0,spoken='',G='conta',K=ST.cfg.conta,S={};
try{const s=localStorage.getItem('cantinho3');if(s){ST={...ST,...JSON.parse(s)};ST.cfg=Object.assign(dcfg(),ST.cfg);}}catch(e){}
const save=()=>{try{localStorage.setItem('cantinho3',JSON.stringify(ST));}catch(e){}};
const GM={
conta:{n:'🎨 Conta colorida',c:'#8a5bff',f:()=>conta(),ops:'pmxd'},
bal:{n:'⚖️ Balança',c:'#2f7bff',f:()=>bal(),ops:'',h:'Comparar quantidades: qual lado tem mais ou menos.'},
mon:{n:'🐻 Ursinho com fome',c:'#ff8a1f',f:()=>mon(),ops:'pm'},
tre:{n:'🚂 Trem',c:'#ff5a4e',f:()=>trem(),ops:'',h:'Completar a sequência de números dos vagões.'},
pes:{n:'🎣 Pescaria',c:'#19b5e8',f:()=>pesca(),ops:'',h:'Pescar os peixes certos, na ordem ou na quantidade pedida. O intervalo define as quantidades.'},
mnt:{n:'🧩 Montar o número',c:'#e64980',f:()=>monta(),ops:'',h:'Juntar dois números para formar o número do bloco.'},
mer:{n:'🛒 Mercadinho',c:'#e8a200',f:()=>merc(),ops:'pm'},
seq:{n:'🔁 Sequência',c:'#ae3ec9',f:()=>seq(),ops:'',lv:1,num:false,h:'Descobrir qual vem depois na sequência.'},
int:{n:'🕵️ Intruso',c:'#4263eb',f:()=>intr(),ops:'',lv:1,num:false,h:'Achar a figura que não combina com as outras.'},
org:{n:'🧺 Organizar',c:'#c2255c',f:()=>org(),ops:'',lv:1,num:false,h:'Arrastar as figuras para o lugar certo.'}};
const CATS={num:{n:'Números',e:'🔢',c:'#8a5bff',g:['conta','mon','mer','mnt','tre']},pen:{n:'Pensar',e:'🧠',c:'#19b5e8',g:['bal','pes','seq','int','org']}};
let GCAT=null;

function say(t){
  spoken=t;
  try{if(ST.vz!==true||!window.speechSynthesis)return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.9;u.volume=(ST.vv==null?100:ST.vv)/100;if(MU)MU.volume=mvol()*.35;u.onend=u.onerror=function(){if(MU)MU.volume=mvol();};speechSynthesis.speak(u);}catch(e){}
}
function burst(){
  for(let i=0;i<14;i++){const s=document.createElement('span');s.className='b';
    s.textContent=["🎉","⭐","✨","🎈"][i%4];s.style.left=R(5,90)+'%';s.style.animationDelay=(i*0.04)+'s';
    document.body.appendChild(s);setTimeout(()=>s.remove(),1700);}
}
function barra0(){
  return `<div class="top"><button onclick="try{speechSynthesis.cancel()}catch(e){};home()">🏠</button><span id="st">⭐ ${ST.stars}</span><button onclick="setup(G)">⚙️</button><button onclick="volPanel()">🎵</button>${ST.vz===true?'<button onclick="say(spoken)">🔊</button>':''}</div>`;
}
function fin(ok,html,voice){
  var qi=Q?Q.res.length:0,mult=Q&&Q.gold[qi]?Q.gold[qi]:0,gain=ok?(mult||1):0;
  if(ok){ST.stars+=gain;burst();if(mult)setTimeout(burst,350);}
  sfx(ok?'win':'ok');
  if(Q){Q.res.push({ok:ok,g:G,gain:gain,gold:mult,t:(html.split('<br>')[1]||voice.replace(/^(Isso mesmo!|Isso!|Muito bem!|Agora sim!)\s*/,'')).replace(/<[^>]*>/g,'')});var dd=document.getElementById('dots');if(dd)dd.innerHTML=dotsHTML();}
  save();var s=document.getElementById('st');if(s)s.textContent='⭐ '+ST.stars;
  document.querySelectorAll('.card button').forEach(function(b){b.disabled=true;});
  msg.innerHTML=html+(ok?'<br>+'+gain+' ⭐'+(mult?' ✨':''):'');
  var n=document.createElement('button');n.className='go';n.textContent=(Q&&Q.res.length>=10)?'🏆':'➡️';n.onclick=nextQ;
  msg.after(n);var pm=praiseMsg(ok,voice);if(pm!==null)say(pm);
}

/* ---------- Menu ---------- */
function gamesHTML(){
  if(!GCAT)return Object.keys(CATS).map(c=>`<button class="tile big" style="--c:${CATS[c].c}" onclick="cat('${c}')"><i>${CATS[c].e}</i>${CATS[c].n}</button>`).join('');
  return `<button class="bk" onclick="cat(null)">⬅️</button><div class="gg">${CATS[GCAT].g.map(g=>{const [e,...r]=GM[g].n.split(' ');return `<button class="tile gt" style="--c:${GM[g].c}" onclick="setup('${g}')"><i>${e}</i>${r.join(' ')}</button>`}).join('')}</div>`;
}
function cat(c){GCAT=c;document.getElementById('jg').innerHTML=gamesHTML();}
function pgSync(){const p=document.getElementById('pager');if(!p)return;const i=Math.round(p.scrollLeft/p.clientWidth);[0,1,2].forEach(k=>document.getElementById('nv'+k).classList.toggle('on',k===i));}
function goPg(i){const p=document.getElementById('pager');p.scrollTo({left:i*p.clientWidth,behavior:'smooth'});}
function home(){
  cur=home;Q=null;
  app.innerHTML=`<div class="top"><span id="st">⭐ ${ST.stars}</span><span class="tb"><button onclick="hist()">📊</button><button onclick="volPanel()">🎵</button><button onclick="config()">⚙️</button></span></div>
  <div class="pager" id="pager" onscroll="pgSync()">
  <div class="pg" id="pgl">${lojaHTML()}</div>
  <div class="pg jg" id="jg">${gamesHTML()}</div>
  <div class="pg" id="pgc">${colHTML()}</div></div>
  <div class="tabs"><button class="nv" id="nv0" onclick="goPg(0)">🛒</button><button class="nv" id="nv1" onclick="goPg(1)">🎮</button><button class="nv" id="nv2" onclick="goPg(2)">📒</button></div>`;
  const p=document.getElementById('pager');p.scrollLeft=p.clientWidth*HP;HP=1;pgSync();
  
}
function config(){
  app.innerHTML=`<h1>⚙️ Ajustes</h1><div class="card">
  <button class="set" onclick="ST.vz=ST.vz!==true;save();config()">🔊 Voz falada: ${ST.vz===true?'ligada':'desligada'}</button>
  <button class="set" onclick="ST.music=!musicOn();save();if(ST.music)musicStart();else musicStop();config()">🎵 Música: ${musicOn()?'ligada':'desligada'}</button>
  <button class="set" onclick="volPanel()">🔉 Volumes</button>
  <button class="set" style="--c:var(--bad)" onclick="if(confirm('Zerar estrelas e amiguinhos?')){ST.stars=0;save();home()}">Zerar progresso</button>
  <div class="hint">Imagens: Fluent Emoji (Microsoft, MIT). Fundo: HC Game Studios.</div><button class="go" onclick="home()">Voltar</button></div>`;
}

/* ---------- Tela de configuração de cada jogo ---------- */
function setup(g){
  G=g;K=ST.cfg[g];cur=GM[g].f;Q=null;const M=GM[g];
  const ops=[...M.ops].map(o=>`<button class="chip ${K.ops.includes(o)?'on':''}" onclick="toggleOp('${o}')">${OPS[o][0]} ${g==='mon'?(o==='p'?'Colocar':'Tirar'):g==='mer'?(o==='p'?'Total':'Troco'):OPS[o][1]}</button>`).join('');
  const range=`<div class="card"><div class="ask">Números: ${K.min} a ${K.max}</div>
  <div class="chips">${[5,10,20,50,100].map(m=>`<button class="chip ${K.max===m&&K.min===0?'on':''}" onclick="setRange(0,${m})">0–${m}</button>`).join('')}</div>
  <div class="row2">de <input id="rmin" type="number" min="0" value="${K.min}"> até <input id="rmax" type="number" min="2" value="${K.max}"><button class="set" onclick="setRange(+rmin.value,+rmax.value)">OK</button></div></div>`;
  const lv=`<div class="card"><div class="ask">Dificuldade</div><div class="chips">${[['🌱','Fácil'],['🌿','Médio'],['🌳','Difícil']].map((x,i)=>`<button class="chip ${K.lv===i+1?'on':''}" onclick="setLv(${i+1})">${x[0]} ${x[1]}</button>`).join('')}</div></div>`;
  app.innerHTML=`<div class="top"><button onclick="home()">🏠</button><span></span></div><h1>${M.n}</h1>
  ${M.num===false?'':range}${M.lv?lv:''}
  ${M.ops?`<div class="card"><div class="ask">Operações</div><div class="chips">${ops}</div></div>`:(M.h?`<div class="hint">${M.h}</div>`:'')}
  <button class="go" onclick="startTest('${g}')">▶️ Jogar!</button>`;
}
function setLv(n){K.lv=n;save();setup(G);}
function setRange(a,b){
  b=Math.max(2,Math.min(100,Math.round(b)||5));a=Math.max(0,Math.min(Math.floor(b/2),Math.round(a)||0));
  K.min=a;K.max=b;save();setup(G);
}
function toggleOp(o){
  const i=K.ops.indexOf(o);
  if(i>=0){if(K.ops.length>1)K.ops.splice(i,1);}else K.ops.push(o);
  K.ops.sort((x,y)=>'pmxd'.indexOf(x)-'pmxd'.indexOf(y));save();setup(G);
}

/* ---------- Geração ---------- */
function genOp(){
  const lo=Math.max(1,K.min);let op=K.ops[R(0,K.ops.length-1)];
  if((op==='x'||op==='d')&&lo*lo>K.max)op='p';
  let a,b,ans;
  if(op==='p'){do{a=R(K.min,K.max-K.min);b=R(K.min,K.max-a);}while(a+b<1);ans=a+b;}
  else if(op==='m'){a=R(lo,K.max);b=R(K.min,a);ans=a-b;}
  else if(op==='x'){a=R(lo,Math.floor(K.max/lo));b=R(lo,Math.floor(K.max/a));ans=a*b;}
  else{b=R(lo,Math.floor(K.max/lo));const q=R(lo,Math.floor(K.max/b));a=b*q;ans=q;}
  return{op,a,b,ans};
}
function wrongs(ans){const s=new Set([ans]);while(s.size<3){const w=ans+R(-3,3);if(w>=0&&w<=K.max)s.add(w);}return[...s];}

/* ---------- Conta colorida ---------- */
function conta(){
  cur=conta;W=0;const {op,a,b,ans}=genOp(),e=EM[R(0,EM.length-1)],vis=K.max<=10&&(op==='p'||op==='m');
  const o1=vis?e.repeat(a):'',o2=vis?(op==='p'?e.repeat(b):`<span class="x">${e.repeat(b)}</span>`):'';
  S={ans,eq:`${a} ${OPS[op][2]} ${b} é igual a ${ans}`};
  app.innerHTML=barra()+`<div class="card"><div class="ask">Qual número encaixa?</div>
  <div class="eq"><div class="col" onclick="say('${a}')"><div class="blk" style="--c:${col(a)}">${a}</div><div class="objs">${o1}</div></div>
  <div class="sg">${OPS[op][0]}</div>
  <div class="col" onclick="say('${b}')"><div class="blk" style="--c:${col(b)}">${b}</div><div class="objs">${o2}</div></div>
  <div class="sg">=</div><div class="col"><div class="slot" id="slot">?</div></div></div>
  <div class="opts">${wrongs(ans).sort(()=>Math.random()-.5).map(n=>`<button class="opt" style="--c:${col(n)}" onclick="cA(this,${n})">${n}</button>`).join('')}</div>
  <div class="msg" id="msg"></div></div>`;
  say(`Quanto é ${a} ${OPS[op][2]} ${b}?`);
}
function cA(btn,n){
  if(n===S.ans){slot.textContent=n;slot.style.setProperty('--c',col(n));slot.classList.add('on');
    fin(W===0,W===0?'🎉 Isso!':'✅ Agora sim!','Isso mesmo! '+S.eq);}
  else{W++;sfx('no');btn.classList.add('sh');btn.disabled=true;msg.textContent='Quase! Tenta de novo 💪';say('Tente de novo!');}
}

/* ---------- Balança (comparação) ---------- */
function bal(){
  cur=bal;W=0;
  const a=R(K.min,K.max),b=Math.random()<.2?a:R(K.min,K.max),ask=Math.random()<.7?'mais':'menos';
  const side=a===b?'E':((ask==='mais')===(a>b)?'L':'R');
  S={a,b,ask,side};const e=EM[R(0,EM.length-1)],ob=K.max<=20;
  const v=n=>(n===0?'<span class="hint">vazio</span>':ob?`<span class="items">${e.repeat(n)}</span>`:`<span class="num">${n}</span>`)+`<div class="cnt">${n}</div>`;
  app.innerHTML=barra()+`<div class="card"><div class="ask">Qual lado tem ${ask}? <span class="sym">${ask==='mais'?'➕':'➖'}</span></div>
  <div class="scale"><div class="stand"></div><div class="beam" id="beam"><div class="plate l" onclick="say('${a}')">${v(a)}</div><div class="plate r" onclick="say('${b}')">${v(b)}</div></div></div>
  <div class="row"><button class="no" onclick="bA('L')">⬅️</button><button style="--c:var(--sea)" onclick="bA('E')">🟰 Iguais</button><button class="yes" onclick="bA('R')">➡️</button></div>
  <div class="msg" id="msg"></div></div>`;
  say(`Qual lado tem ${ask}?`);
}
function bA(x){
  if(x!==S.side){W++;sfx('no');msg.textContent='Quase! Conta de novo 💪';say('Tente de novo! Conte os dois lados.');return;}
  const {a,b}=S;beam.style.setProperty('--t',(a>b?-10:a<b?10:0)+'deg');
  const t=a>b?`${a} é maior que ${b}`:a<b?`${a} é menor que ${b}`:`${a} é igual a ${b}`;
  fin(W===0,(W===0?'🎉 Isso!':'✅ Agora sim!')+`<br>${a} ${a>b?'>':a<b?'<':'='} ${b}`,'Isso mesmo! '+t);
}

/* ---------- Ursinho ---------- */
function mon(){
  cur=mon;W=0;const m=K.max,lo=Math.max(1,K.min),P=K.ops.includes('p'),M=K.ops.includes('m');let A,N;
  do{N=R(lo,m);A=R(0,m);}while(A===N||!((P&&A<N)||(M&&A>N)));
  S={A,N,c:A};const st=m<=10?[1]:m<=20?[1,5]:[1,5,10];
  app.innerHTML=barra()+`<div class="card"><div class="bear">🐻</div><div class="bubble" onclick="say('Eu quero ${N} biscoitos')">Quero ${N} 🍪!</div>
  <div class="ask">Na mesa tem:</div><div class="tab" id="tab"></div>
  <div class="st">${st.map(s=>`<button onclick="mC(-${s})">➖${s}</button>`).join('')}${st.map(s=>`<button onclick="mC(${s})">➕${s}</button>`).join('')}</div>
  <button class="go" onclick="mOK()">Pronto! ✅</button><div class="msg" id="msg"></div></div>`;
  mR();say(`O ursinho quer ${N} biscoitos. Na mesa tem ${A}. Faça ficar ${N}!`);
}
function mR(){
  const c=S.c;
  tab.innerHTML=(c===0?'<span class="hint">Mesa vazia</span>':K.max<=20?Array.from({length:c},()=>`<button class="ck" onclick="mC(-1)">${S.em||'🍪'}</button>`).join(''):`<span class="num">${c}</span>`)+`<div class="cnt">${c}</div>`;
}
function mC(d){S.c=Math.max(0,Math.min(150,S.c+d));mR();}
function mOK(){
  const {A,N,c}=S;
  if(c===N){const t=N>=A?`${A} + ${N-A} = ${N}`:`${A} − ${A-N} = ${N}`;
    fin(W===0,(W===0?'🎉 Perfeito!':'✅ Agora sim!')+'<br>'+t,'Isso! O ursinho ficou feliz!');}
  else{W++;sfx('no');const t=c<N?'Ainda estou com fome! Põe mais.':'É muito! Tira alguns.';msg.textContent='🐻 '+t;say(t);}
}
/* ---------- Trem ---------- */
function trem(){
  cur=trem;W=0;const len=Math.max(2,Math.min(5,K.max-K.min+1)),down=Math.random()<.3;
  const s0=R(K.min,K.max-len+1);let seq=Array.from({length:len},(_,i)=>s0+i);if(down)seq.reverse();
  const h=R(0,len-1),ans=seq[h];S={ans,eq:'o vagão que faltava era o '+ans};
  const wg=seq.map((n,i)=>i===h?'<div class="wg"><div class="slot" id="slot">?</div></div>':`<div class="wg" onclick="say('${n}')"><div class="blk" style="--c:${col(n)}">${n}</div></div>`).join('');
  app.innerHTML=barra()+`<div class="card"><div class="ask">Qual número falta no trem?</div>
  <div class="train"><span class="loco">🚂</span>${wg}</div>
  <div class="opts">${wrongs(ans).sort(()=>Math.random()-.5).map(n=>`<button class="opt" style="--c:${col(n)}" onclick="cA(this,${n})">${n}</button>`).join('')}</div>
  <div class="msg" id="msg"></div></div>`;
  say('Qual número falta no trem?');
}
/* ---------- Pescaria ---------- */
const FC=[['vermelho','vermelhos','#ff4d4d'],['azul','azuis','#2f7bff'],['verde','verdes','#2fcb7b'],['amarelo','amarelos','#ffc21a'],['roxo','roxos','#8a5bff'],['laranja','laranjas','#ff8a1f']];
const fish=(c,w)=>`<svg viewBox="0 0 64 40" style="width:${w/16}rem;display:block"><path d="M50 20 L63 7 L63 33Z" fill="${FC[c][2]}" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="28" cy="20" rx="26" ry="16" fill="${FC[c][2]}" stroke="#fff" stroke-width="2.5"/><ellipse cx="28" cy="28" rx="20" ry="6" fill="#fff" opacity=".28"/><circle cx="14" cy="16" r="4.5" fill="#fff"/><circle cx="13" cy="16" r="2.2" fill="#1f2a44"/></svg>`;
function pesca(){
  cur=pesca;W=0;const count=Math.random()<.4,lo=Math.max(1,K.min),idx=[0,1,2,3,4,5].sort(()=>Math.random()-.5);
  let req,N=0;
  if(count){N=R(lo,Math.min(K.max,6));req=Array(N).fill(idx[0]);}
  else req=idx.slice(0,R(2,K.max<=5?3:K.max<=10?4:5));
  const tank=[];
  for(let c=0;c<6;c++){let n=count?(c===req[0]?N+R(0,2):R(0,2)):(req.includes(c)?R(1,2):R(0,2));while(n--)tank.push(c);}
  while(tank.length<6)tank.push(R(0,5));
  tank.sort(()=>Math.random()-.5);S={req,p:0,count};
  const want=count?`<div class="ask">Pesque</div><div class="orderrow"><div class="blk sm" style="--c:${col(N)}">${N}</div><span class="sg">✖️</span>${fish(req[0],88)}</div><div class="cnt" id="prog">&nbsp;</div>`
    :`<div class="ask">Pesque na ordem</div><div class="orderrow">${req.map((c,k)=>`<span class="ord" id="o${k}">${fish(c,68)}</span>${k<req.length-1?'<span class="sg">➡️</span>':''}`).join('')}</div>`;
  app.innerHTML=barra()+`<div class="card">${want}<div class="pond">${tank.map((c,k)=>`<button class="fb" id="f${k}" style="animation-delay:${(k%5)*.3}s" onclick="fA(${k},${c})">${fish(c,74)}</button>`).join('')}</div><div class="msg" id="msg"></div></div>`;
  say(count?(N===1?`Pesque 1 peixe ${FC[req[0]][0]}`:`Pesque ${N} peixes ${FC[req[0]][1]}`):'Pesque na ordem: '+req.map((c,k)=>(k?'depois ':'')+'o peixe '+FC[c][0]).join(', '));
}
function fA(k,c){
  const b=document.getElementById('f'+k);
  if(c===S.req[S.p]){
    b.classList.add('got');b.disabled=true;S.p++;
    if(S.count)prog.textContent='✅'.repeat(S.p);else document.getElementById('o'+(S.p-1)).classList.add('done');
    if(S.p>=S.req.length)fin(W===0,W===0?'🎉 Pescou tudo!':'✅ Muito bem!','Muito bem! Você pescou tudo!');else say('Isso!');
  }else{W++;sfx('no');b.classList.add('sh');msg.textContent='Quase! Olha a cor 🎣';say('Esse não. Olha a cor!');setTimeout(()=>b.classList.remove('sh'),400);}
}
/* ---------- Montar o número ---------- */
function monta(){
  cur=monta;W=0;const lo=K.min,N=R(Math.max(2,2*lo),K.max),a=R(lo,N-lo),b=N-a;
  const t=[a,b];while(t.length<6)t.push(R(lo,K.max));t.sort(()=>Math.random()-.5);
  S={N,t,sel:[],lock:0};
  app.innerHTML=barra()+`<div class="card"><div class="ask">Junte dois para fazer</div>
  <div class="eq"><div class="col" onclick="say('${N}')"><div class="blk" style="--c:${col(N)}">${N}</div></div><div class="sg">=</div>
  <div class="col"><div class="slot" id="s0">?</div></div><div class="sg">➕</div><div class="col"><div class="slot" id="s1">?</div></div></div>
  <div class="opts">${t.map((n,i)=>`<button class="opt" style="--c:${col(n)}" onclick="mTap(${i})">${n}</button>`).join('')}</div>
  <div class="msg" id="msg"></div></div>`;
  say(`Junte dois números para fazer ${N}`);
}
function mUp(){
  [0,1].forEach(k=>{const el=document.getElementById('s'+k),i=S.sel[k];
    if(i!==undefined){el.textContent=S.t[i];el.style.setProperty('--c',col(S.t[i]));el.classList.add('on');}
    else{el.textContent='?';el.classList.remove('on');}});

/* ---------- Teste de 10 questões ---------- */
function dotsHTML(){var h='';for(var i=0;i<10;i++){var x=Q.res[i],c=i<Q.res.length?(x.ok?'ok':'bad')+(x.gold?' g':''):(i===Q.res.length?'cur':'');h+='<i class="'+c+'"></i>';}return h;}
function barra(){var m=Q&&Q.gold[Q.res.length];return barra0()+(Q?'<div class="dots" id="dots">'+dotsHTML()+'</div>':'')+(m?'<div class="goldtag">⭐ ×'+m+'</div>':'');}
function startTest(g){G=g;K=ST.cfg[g];var n=R(1,2),gd={};while(Object.keys(gd).length<n)gd[R(0,9)]=R(2,3);Q={res:[],gold:gd};GM[g].f();}
function nextQ(){if(Q&&Q.res.length>=10)return resultado();cur();}
function resultado(){
  if(Q.done)return;Q.done=true;
  var r=Q.res,sc=r.filter(function(x){return x.ok;}).length,g=G,earned=r.reduce(function(a,x){return a+x.gain;},0),bonus=sc>=10?3:sc===9?2:sc>=7?1:0;
  ST.stars+=bonus;ST.hist.unshift({g:g,d:Date.now(),s:sc,r:r.map(function(x){return x.ok?1:0;})});ST.hist=ST.hist.slice(0,5);save();
  var medal=sc>=10?'🥇':sc===9?'🥈':'🥉';
  var cards=r.map(function(x,i){return '<div class="rc '+(x.ok?'ok':'bad')+(x.gold?' gd':'')+'"><span class="rn">'+(i+1)+'</span><span class="rt">'+(x.gold?'<b class="gb">⭐×'+x.gold+'</b> ':'')+(x.t||GM[x.g].n.split(' ')[0])+'</span><span class="rk">'+(x.ok?'✅':'❌')+'</span></div>';}).join('');
  app.innerHTML='<div class="top"><button onclick="home()">🏠</button><span id="st">⭐ '+ST.stars+'</span><span></span></div><div class="card"><div class="bear">🏆</div><h2 class="big">'+sc+' de 10</h2><div class="ask">+'+earned+' ⭐</div>'+(bonus?'<div class="bonus">'+medal+' +'+bonus+' ⭐</div>':'')+'</div><div class="rg">'+cards+'</div><button class="go" onclick="startTest(\''+g+'\')">🔁</button>';

}
function hist(){
  var rows=ST.hist.length?ST.hist.map(function(h){var d=new Date(h.d);return '<div class="card hr2"><span class="hg">'+GM[h.g].n.split(' ')[0]+'</span><span>'+d.getDate()+'/'+(d.getMonth()+1)+'</span><b>'+h.s+'/10</b><span class="dots mini">'+h.r.map(function(k){return '<i class="'+(k?'ok':'bad')+'"></i>';}).join('')+'</span></div>';}).join(''):'<div class="card"><div class="hint">Ainda não há testes</div></div>';

}

function lojaHTML(){

  if(np)h+='<button class="go" onclick="abrir()">🎁 '+np+'</button>';
  return h;

function comprar(i){var k=PK[i];if(ST.stars<k.p)return;ST.stars-=k.p;ST.packs.push({n:k.n,p:k.p});save();sfx('ok');refreshHome();}
function refreshHome(){var l=document.getElementById('pgl'),c=document.getElementById('pgc'),s=document.getElementById('st');if(l)l.innerHTML=lojaHTML();if(c)c.innerHTML=colHTML();if(s)s.textContent='⭐ '+ST.stars;}
function abrir(){
  var pk=ST.packs.shift();if(!pk)return;
  var r=[];for(var i=0;i<pk.n;i++){
    var c=PAISES[R(0,PAISES.length-1)].c,novo=!ST.col[c],rf=0;
    if(novo){ST.col[c]=1;ST.newc[c]=1;}else{rf=Math.floor(pk.p/pk.n/2);ST.stars+=rf;}
    r.push({c:c,novo:novo,rf:rf});
  }
  save();P={r:r,i:-1};HP=0;cur=home;
  app.innerHTML='<div class="top"><button onclick="home()">🏠</button><span id="st">⭐ '+ST.stars+'</span><span></span></div><div class="opn"><button class="pkopen" onclick="revelar()"><span class="pkb">🌍</span></button></div>';
  sfx('ok');
}
function revelar(){
  P.i++;
  if(P.i>=P.r.length){HP=2;home();return;}
  var x=P.r[P.i],last=P.i===P.r.length-1;
  var tag=x.novo?'<div class="tag nova">NOVA!</div>':'<div class="tag rep">+'+x.rf+' ⭐</div>';
  app.innerHTML='<div class="top"><button onclick="HP=2;home()">🏠</button><span id="st">⭐ '+ST.stars+'</span><span></span></div>'+tag+'<div class="pop">'+cardHTML(x.c)+'</div><button class="go" onclick="revelar()">'+(last?'📒':'➡️')+'</button>';
  burst();sfx(x.novo?'win':'ok');
